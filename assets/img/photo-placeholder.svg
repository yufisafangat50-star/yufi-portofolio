<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14213D" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <!-- Background Card Canvas -->
  <rect width="400" height="480" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern in background -->
  <g opacity="0.15" stroke="#14213D" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="480"/>
    <line x1="100" y1="0" x2="100" y2="480"/>
    <line x1="150" y1="0" x2="150" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="250" y1="0" x2="250" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="350" y1="0" x2="350" y2="480"/>
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="360" x2="400" y2="360"/>
    <line x1="0" y1="420" x2="400" y2="420"/>
  </g>

  <!-- Silhouette / Portrait Placeholder Graphic -->
  <g transform="translate(200, 210)" text-anchor="middle">
    <!-- Outer Ring -->
    <circle r="80" fill="#FFFFFF" opacity="0.8" />
    <!-- Monogram Circle -->
    <circle r="70" fill="url(#avatarGrad)" />
    <!-- Initial / Monogram Text -->
    <text y="18" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800" letter-spacing="-1">YS</text>
  </g>

  <!-- Tag / Caption info at bottom -->
  <g transform="translate(200, 370)" text-anchor="middle">
    <rect x="-120" y="-18" width="240" height="36" rx="18" fill="#FFFFFF" opacity="0.9" />
    <text y="5" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" letter-spacing="0.2">Foto Profil Yufi Safangat</text>
  </g>
</svg>
